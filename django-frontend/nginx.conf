server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback ──────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Django config API ─────────────────────────────────────────────────
    # Covers /api/dspace-config/* and /api/cockpit/*
    location /api/ {
        proxy_pass        http://django:5189/api/;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        # Forward cookies so Django session auth works
        proxy_pass_header Set-Cookie;
    }

    # ── Django admin UI ───────────────────────────────────────────────────
    location /admin/ {
        proxy_pass        http://django:5189/admin/;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
    }

    # ── Django static files (admin CSS/JS via WhiteNoise) ─────────────────
    location /static/ {
        proxy_pass        http://django:5189/static/;
        proxy_set_header  Host $host;
        # Cache static assets aggressively — WhiteNoise sets long max-age
        proxy_cache_valid 200 1d;
        add_header        Cache-Control "public, max-age=86400";
    }
}
